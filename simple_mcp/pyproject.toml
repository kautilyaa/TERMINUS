[project]
name = "terminal-mcp"
version = "0.2.0"
description = "Terminal MCP server: run commands and read/write files locally or on SSH hosts"
authors = [
    {name = "Arunbh Yashaswi", email = "arunbhy@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# The server needs only FastMCP; SSH goes through the system's OpenSSH client.
dependencies = [
    "fastmcp>=2.11",
]

[project.optional-dependencies]
# The Slack bot in client/ (it talks to the server over SSE).
slack = [
    "aiohttp>=3.9",
    "anthropic>=0.40",
    "mcp>=1.9",
    "python-dotenv>=1.0",
    "slack-sdk>=3.27",
]

[project.scripts]
terminal-mcp = "terminal_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kautilyaa/TERMINUS"
Repository = "https://github.com/kautilyaa/TERMINUS"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_mcp"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
