services:
  mcp-slack-bot:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-5}
      # The server runs on the host (terminal-mcp --transport sse --port 8002); "localhost" here is the container.
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://host.docker.internal:8002/sse}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
